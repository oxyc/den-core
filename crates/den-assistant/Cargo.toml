[package]
name = "den-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Assistant writes (den-spec wire/assistant-v1.md): keys, sealed requests, token claims, wraps and the accept rules. Pure: randomness and time arrive as inputs."

[dependencies]
serde_json.workspace = true
# Reading only a compact projection's names (`open_projection_compact`), skipping its lists unparsed.
serde.workspace = true
hpke.workspace = true
ed25519-dalek.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
zeroize.workspace = true
rand_core.workspace = true
# Projections (§15) are raw DEFLATE: the same pure-Rust compressor, at the same pinned version, as library v4.
miniz_oxide.workspace = true

[dev-dependencies]
# The official X-Wing and HPKE-PQ vectors: X-Wing's own, and HPKE's for X-Wing with HKDF-SHA256, whose only published
# AEAD is ChaCha20-Poly1305.
x-wing.workspace = true
hpke = { workspace = true, features = ["chacha"] }
