[package]
name = "den-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["recovery-kdf", "tracker-delivery", "profile-admin"]
recovery-kdf = ["dep:argon2"]
tracker-delivery = []
profile-admin = []
# Build-time partitions for the lifecycle browser modules. With neither (ordinary builds) or both (Cargo's
# workspace-wide feature unification) enabled, the core retains every operation.
browser-startup = []
browser-deferred = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
miniz_oxide.workspace = true
argon2 = { workspace = true, optional = true }
hkdf.workspace = true
# Only for its `zeroize` feature: HKDF keeps the PRK in HMAC state.
hmac.workspace = true
sha2.workspace = true
zeroize.workspace = true
# Assistant writes (den-spec `wire/assistant-v1.md`): the crypto and accept rules, which den-edge and den-mcp also use.
den-assistant.workspace = true

[dev-dependencies]
# The assistant vectors' grant key that is no curve point.
ed25519-dalek.workspace = true
