name: Shared sync policy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
# The three build jobs run side by side. A fourth clean-room job combines the native and WASM outputs and
# verifies the exact packages clients receive.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # den-spec holds the store format's test vectors. Checked out beside this repo because
      # `den-store`'s contract test reads them — and FAILS without them, deliberately: that test exists
      # to catch a reader drifting from the Python writer in den-dataset, and it can only do that if it
      # can find the fixture. It was previously enforced by nothing at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oxyc/den-spec
          ref: main
          path: den-spec-checkout
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
      # The format gate, then `cargo test --locked --workspace` (den-sync, den-store, ...).
      - run: bash scripts/build-bindings.sh --only checks
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The prebuilt, checksum-verified release rather than `cargo install`, which compiled it from source on
      # every run (over two minutes). The version must match the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@0.2.129
      # wasm-opt and wasm2js at the version build-bindings.sh requires, from Binaryen's own release, checksummed.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p .tools/bin .tools/lib
          cp "$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" \
            "$RUNNER_TEMP/binaryen-version_133/bin/wasm2js" .tools/bin/
          cp "$RUNNER_TEMP"/binaryen-version_133/lib/libbinaryen.* .tools/lib/
      - run: bash scripts/build-bindings.sh --only wasm
      - run: node scripts/test-wasm.mjs
      - run: node scripts/test-wasm-lifecycle.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-bindings
          path: |
            web/generated
            web-tizen3/generated

  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-ios,aarch64-apple-ios-sim
      # Every Apple target's release build, across runs. Keyed on the toolchain and Cargo.lock by default.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # build-bindings keeps the cross-target build-std trees under target/native-cross so this cache can
          # restore them. Include the two scripts that define their deployment metadata in the cache identity.
          shared-key: native-${{ hashFiles('scripts/build-bindings.sh', 'scripts/rustc-apple-deployment.sh') }}
      - run: bash scripts/build-bindings.sh --only native
      - run: swift build --package-path Swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-bindings
          path: |
            Swift/Sources
            Swift/Artifacts

  vendor:
    needs: [native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-bindings
          path: Swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bindings
          path: .
      - run: node scripts/test-vendor.mjs
