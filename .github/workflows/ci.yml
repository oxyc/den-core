name: Shared sync policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# The three build jobs run side by side. A fourth clean-room job combines the native and WASM outputs and
# verifies the exact packages clients receive.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # den-spec holds the store format's test vectors. Checked out beside this repo because
      # `den-store`'s contract test reads them — and FAILS without them, deliberately: that test exists
      # to catch a reader drifting from the Python writer in den-dataset, and it can only do that if it
      # can find the fixture. It was previously enforced by nothing at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oxyc/den-spec
          ref: main
          path: den-spec-checkout
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
      # The format gate, then `cargo test --locked --workspace` (den-sync, den-store, ...).
      - run: bash scripts/build-bindings.sh --only checks
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      # The prebuilt, checksum-verified release rather than `cargo install`, which compiled it from source on
      # every run (over two minutes). The version must match the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-bindgen@0.2.129
      - run: bash scripts/build-bindings.sh --only wasm
      - run: node scripts/test-wasm.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-bindings
          path: web/generated

  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-ios,aarch64-apple-ios-sim
      # Every Apple target's release build, across runs. Keyed on the toolchain and Cargo.lock by default.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native
      - run: bash scripts/build-bindings.sh --only native
      - run: swift build --package-path Swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-bindings
          path: |
            Swift/Sources
            Swift/Artifacts

  vendor:
    needs: [native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-bindings
          path: Swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-bindings
          path: web/generated
      - run: node scripts/test-vendor.mjs
