name: Shared sync policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bindings:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # den-spec holds the store format's test vectors. Checked out beside this repo because
      # `den-store`'s contract test reads them — and FAILS without them, deliberately: that test exists
      # to catch a reader drifting from the Python writer in den-dataset, and it can only do that if it
      # can find the fixture. It was previously enforced by nothing at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: oxyc/den-spec
          ref: main
          path: den-spec-checkout
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown
      # Every target's release build, across runs. Keyed on the toolchain and Cargo.lock by default.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # The prebuilt, checksum-verified release rather than `cargo install`, which compiled it from source on
      # every run (over two minutes). The version must match the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen@0.2.128
      # Its `cargo test -p den-sync` replays den-spec's library-v4 vectors, so it needs den-spec too.
      - run: bash scripts/build-bindings.sh
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout
      # The whole workspace, not just den-sync: `default-members` is den-sync alone, so a bare
      # `cargo test` silently skipped den-store entirely.
      - run: cargo test --locked --workspace
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout
      - run: swift build --package-path Swift
      - run: node scripts/test-wasm.mjs
