[workspace]
members = ["crates/den-sync", "crates/den-store", "bindings/native", "bindings/web"]
default-members = ["crates/den-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Library v4 §4 pins the compressor: den-core compresses at level 9 with exactly the version in Cargo.lock.
miniz_oxide = "=0.9.1"
den-sync = { path = "crates/den-sync" }
den-store = { path = "crates/den-store" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

