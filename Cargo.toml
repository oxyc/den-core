[workspace]
members = [
    "crates/den-sync",
    "crates/den-store",
    "crates/den-assistant",
    "bindings/native",
    "bindings/web",
]
default-members = ["crates/den-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: library v4 §4 compares documents by their JCS bytes, so a number must parse to the double it
# spells. Without it about one shortest-form fraction in ten parses 1 ULP off and a `resume.value` moves.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Library v4 §4 pins the compressor: den-core compresses at level 9 with exactly the version in Cargo.lock.
miniz_oxide = "=0.9.1"
# The recovery code (den-spec `wire/recovery-code.md` §3): Argon2id, then HKDF-SHA256. No randomness or
# password-hash features, since the op takes everything as input. `zeroize` wipes what they hold of the code's
# derivation: Argon2's intermediate hashes and HMAC's keyed state (the HKDF PRK). Argon2's 64 MiB of blocks are
# allocated and wiped by den-sync itself (`recovery.rs`): the crate's own allocation is freed unwiped.
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Assistant writes (den-spec `wire/assistant-v1.md`): HPKE (RFC 9180) with the X-Wing KEM, Ed25519 signatures and
# AES-256-GCM wraps. No `getrandom` anywhere: randomness arrives as input, so the crate builds for wasm32 as is.
# `ed25519-dalek` without `fast`: its precomputed tables would add to the web binding for a handful of signatures.
# X-Wing needs both `mlkem` and `x25519`; `x25519` also brings HKDF-SHA256.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "mlkem", "x25519", "aes"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
rand_core = { version = "0.10.1", default-features = false }
x-wing = { version = "0.1.1", default-features = false, features = ["hazmat"] }
den-sync = { path = "crates/den-sync" }
den-assistant = { path = "crates/den-assistant" }
den-store = { path = "crates/den-store" }

# One Argon2id at 64 MiB, t = 3 takes seconds unoptimised; the tests run several.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

