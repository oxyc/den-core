[workspace]
members = ["crates/den-sync", "bindings/native", "bindings/web"]
default-members = ["crates/den-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
den-sync = { path = "crates/den-sync" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

